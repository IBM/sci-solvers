# SciPy LOBPCG
# on the GPU with the portable batched matrix-vector product, the
# baseline for the Triton kernel in ../solvers/.
# Solver settings as in ../solvers/lobpcg_gpu.yaml.
common_file: ../_common.yaml
solver_variants:
  - id: lobpcg_gpu_batched_spin_sq_null
    name: lobpcg
    init_kwargs:
      device: cuda
      matvec_impl: batched
      symmetrize_spin: true
      tol: 1.0e-4
      maxiter: 80
    call_kwargs: {}
