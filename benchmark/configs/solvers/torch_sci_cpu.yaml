# torch-sci on CPU, unpenalized; otherwise as torch_sci_gpu.
common_file: ../_common.yaml
solver_variants:
  - id: torch_sci_cpu_spin_sq_null
    name: torch_sci
    init_kwargs: {device: cpu, symmetrize_spin: true, davidson_block_size: 10,
                  max_davidson_iters: 8, davidson_tolerance: 1.0e-4, apply_ab_projection: false}
    call_kwargs: {spin_sq: null}
