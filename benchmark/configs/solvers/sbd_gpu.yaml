# sbd's Davidson on one GPU (needs `--extra sbd-gpu`), same settings as torch_sci_gpu:
# eps = residual tolerance, max_nb = subspace size, max_it = restarts.
common_file: ../_common.yaml
solver_variants:
  - id: sbd_gpu_spin_sq_null
    name: sbd
    init_kwargs: {device: gpu, symmetrize_spin: true,
                  sbd_config: {eps: 1.0e-4, max_nb: 10, max_it: 8, max_time: 36000}}
    call_kwargs: {spin_sq: null}
