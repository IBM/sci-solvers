name: CI

# scripts/local_ci.sh runs these same steps locally; keep the two in sync.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: License headers
        run: python3 scripts/check_license_headers.py $(git ls-files '*.py' '*.sh')
      - name: Ruff
        run: uvx ruff@0.17.3 check
      - name: Ruff format
        run: uvx ruff@0.17.3 format --check

  test:
    runs-on: ubuntu-latest
    # A hung distributed test would otherwise block the job for GitHub's 6 h default.
    timeout-minutes: 60
    env:
      # Pin the interpreter to the tested one; uv otherwise picks the newest release.
      UV_PYTHON: "3.13"
      # One thread per process, as in scripts/local_ci.sh: several tests spawn multi-rank
      # gloo groups, and a default thread pool per rank oversubscribes the runner's cores.
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Runner resources (temporary diagnostic)
        run: nproc && free -h
      - name: Install
        run: uv sync --extra cpu --extra benchmark
      - name: mypy
        run: uv run --extra cpu --extra benchmark mypy
      - name: Tests
        run: uv run --extra cpu --extra benchmark pytest -m "not slow" -n auto -v --durations=15
