[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-sci-solver"
version = "0.11.0"
description = "PyTorch port of SBD's selected-basis CI for SQD"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "IBM Research" }]
keywords = ["quantum chemistry", "selected CI", "SQD", "pytorch", "cuda"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["torch>=2.0", "numpy>=1.24", "nvidia-ml-py>=12.0"]

[project.optional-dependencies]
# PySCF reads the FCIDUMP and converts integrals; required for any
# realistic chemistry run but not for the pure-torch kernels alone.
pyscf = ["pyscf>=2.5"]
# qiskit-addon-sqd is required for the SQD iteration loop
# (configuration recovery + bitstring-matrix -> ci_strs) and for the
# solve_fermion / solve_sci_batch / make_torch_sci_solver integration API.
sqd = ["qiskit-addon-sqd>=0.10"]

[dependency-groups]
# Full development env: tests need both pyscf and qiskit-addon-sqd.
dev = ["pyscf>=2.5", "qiskit-addon-sqd>=0.10", "pytest>=7"]

[project.urls]
Documentation = "https://github.com/IBM/sci-solvers/tree/main/packages/torch-sci-solver"

[project.scripts]
torch-sci-solver-smoke = "torch_sci_solver.scripts.cuda_smoke:main"

# ---------------------------------------------------------------------------
# setuptools-specific config
# ---------------------------------------------------------------------------

[tool.setuptools.packages.find]
include = ["torch_sci_solver*"]
exclude = ["tests*", "scripts*"]

[tool.setuptools.package-data]
torch_sci_solver = ["data/*.fcidump", "data/*.npz", "data/README.md"]

# Tests / pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["tests"]
addopts = "-v"
